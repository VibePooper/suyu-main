name: Windows x64 Build

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-windows:
    name: Build suyu + Nextendo (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Install MSYS2 autotools
        shell: pwsh
        run: |
          if (Test-Path "C:\msys64\usr\bin\bash.exe") {
            & "C:\msys64\usr\bin\bash.exe" -lc "pacman --noconfirm -Sy --needed autoconf automake libtool"
          } else {
            Write-Error "MSYS2 was not found on the GitHub Windows runner."
            exit 1
          }

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_QT=ON -DYUZU_USE_BUNDLED_QT=ON -DYUZU_USE_BUNDLED_FFMPEG=ON -DYUZU_USE_BUNDLED_OPENSSL=ON -DYUZU_USE_BUNDLED_SDL3=ON -DYUZU_USE_BUNDLED_SIRIT=ON -DYUZU_CMD=ON -DYUZU_ROOM=ON -DYUZU_ROOM_STANDALONE=ON -DENABLE_UPDATE_CHECKER=OFF -DUSE_DISCORD_PRESENCE=OFF -DYUZU_TESTS=OFF -DBUILD_TESTING=OFF

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --target suyu suyu-cmd --parallel 2

      - name: Verify binaries
        shell: pwsh
        run: |
          if (!(Test-Path "build/bin/suyu.exe")) { Write-Error "build/bin/suyu.exe was not produced."; exit 1 }
          Get-ChildItem build/bin -Recurse | Select-Object FullName,Length

      - name: Package Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item build/bin/* release/ -Recurse -Force
          if (Test-Path LICENSE.txt) { Copy-Item LICENSE.txt release/ }
          if (Test-Path README.md) { Copy-Item README.md release/ }
          Compress-Archive -Path release/* -DestinationPath suyu-nextendo-windows-x64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: suyu-nextendo-windows-x64
          path: suyu-nextendo-windows-x64.zip
          if-no-files-found: error
          retention-days: 30